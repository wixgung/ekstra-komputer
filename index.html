<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi Ekstrakurikuler Komputer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --bg:#0A0C13;
  --bg-2:#0E1119;
  --surface:#151824;
  --surface-2:#1B1F2E;
  --border:rgba(255,255,255,.08);
  --border-soft:rgba(255,255,255,.05);
  --text:#EDEEF4;
  --text-dim:#9BA1B5;
  --text-faint:#5C6478;
  --violet:#8B7CFB;
  --violet-soft:rgba(139,124,251,.14);
  --cyan:#22D3EE;
  --cyan-soft:rgba(34,211,238,.14);
  --pink:#F76FB0;
  --amber:#F5B860;
  --mint:#5EEAB0;
  --grad-brand:linear-gradient(135deg,#8B7CFB 0%,#22D3EE 100%);
  --font-display:'Plus Jakarta Sans', sans-serif;
  --font-body:'Plus Jakarta Sans', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
/* ambient background */
body::before, body::after{
  content:''; position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none;
}
body::before{ width:520px; height:520px; background:var(--violet); opacity:.16; top:-180px; left:-120px; }
body::after{ width:460px; height:460px; background:var(--cyan); opacity:.13; top:280px; right:-160px; }
.bg-grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg, rgba(0,0,0,.7), transparent 70%);
}
a{color:var(--cyan); text-decoration:none;}
h1,h2,h3{font-family:var(--font-display); font-weight:800; margin:0; letter-spacing:-.02em;}
p{margin:0; color:var(--text-dim);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:var(--bg-2);}
::-webkit-scrollbar-thumb{background:var(--surface-2); border-radius:6px;}

/* ---------- NAV ---------- */
.topnav{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:16px;
  padding:16px 28px;
  background:rgba(10,12,19,.72);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; flex-shrink:0;}
.brand .logo{
  width:34px; height:34px; border-radius:10px; background:var(--grad-brand);
  display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
}
.searchbox{
  flex:1; max-width:360px; margin-left:auto; position:relative;
}
.searchbox input{
  width:100%; padding:10px 14px 10px 38px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-family:var(--font-body); font-size:13.5px;
}
.searchbox input:focus{outline:none; border-color:var(--violet);}
.searchbox input::placeholder{color:var(--text-faint);}
.searchbox .ic{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:14px;}

/* ---------- HERO ---------- */
.hero{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:64px 28px 20px;}
.eyebrow{
  display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12px;
  color:var(--cyan); text-transform:uppercase; letter-spacing:.1em; background:var(--cyan-soft);
  border:1px solid rgba(34,211,238,.3); padding:6px 12px; border-radius:20px; margin-bottom:18px;
}
.hero h1{font-size:clamp(30px,5vw,48px); line-height:1.1; max-width:820px;}
.hero h1 .grad{
  background:var(--grad-brand); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p.lede{font-size:16.5px; max-width:600px; margin-top:14px;}
.stats-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:26px;}
.stat-pill{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  padding:9px 16px; border-radius:12px; font-size:13px; color:var(--text-dim);
}
.stat-pill b{color:var(--text); font-family:var(--font-mono); font-size:14px;}

/* ---------- FILTER BAR ---------- */
.filterbar{
  position:sticky; top:66px; z-index:30;
  max-width:1180px; margin:26px auto 0; padding:14px 28px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:rgba(10,12,19,.85); backdrop-filter:blur(10px); border-radius:14px;
}
.sem-toggle{display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); padding:4px; border-radius:12px; flex-shrink:0;}
.sem-btn{
  font-family:var(--font-mono); font-size:12px; padding:8px 14px; border-radius:9px; border:none;
  background:transparent; color:var(--text-dim); cursor:pointer; font-weight:600; white-space:nowrap;
}
.sem-btn.active{background:var(--grad-brand); color:#0A0C13;}
.chip-scroll{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; flex:1; scrollbar-width:none;}
.chip-scroll::-webkit-scrollbar{display:none;}
.chip{
  font-family:var(--font-mono); font-size:12px; padding:8px 14px; border-radius:20px; white-space:nowrap;
  background:var(--surface); border:1px solid var(--border); color:var(--text-dim); cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; gap:6px; transition:.15s;
}
.chip:hover{border-color:var(--violet); color:var(--text);}
.chip.active{background:var(--violet-soft); border-color:var(--violet); color:var(--violet);}
.chip .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}

/* ---------- MAIN / GRID ---------- */
main{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:34px 28px 100px;}
.sec-label{
  display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:12.5px;
  color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em; margin:34px 0 16px;
}
.sec-label:first-child{margin-top:0;}
.sec-label::after{content:''; flex:1; height:1px; background:var(--border);}
.sec-count{color:var(--text-dim); text-transform:none; letter-spacing:0; font-family:var(--font-body);}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden;
  display:flex; flex-direction:column; text-decoration:none; color:var(--text);
  transition:transform .18s, border-color .18s, box-shadow .18s;
}
.card:hover{
  transform:translateY(-5px); border-color:rgba(139,124,251,.4);
  box-shadow:0 16px 40px -12px rgba(139,124,251,.35);
}
.card-thumb{width:100%; aspect-ratio:16/10; position:relative; overflow:hidden; background:var(--surface-2);}
.card-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.card-thumb .fallback{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:38px;
}
.card-thumb .badge-icon{
  position:absolute; bottom:10px; left:10px; width:34px; height:34px; border-radius:9px;
  background:rgba(10,12,19,.55); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
  font-size:16px; border:1px solid rgba(255,255,255,.15);
}
.card-body{padding:16px 16px 18px; display:flex; flex-direction:column; gap:8px; flex:1;}
.card-title{font-size:14.5px; font-weight:700; line-height:1.35;}
.card-desc{
  font-size:12.5px; color:var(--text-dim); line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.4em;
}
.card-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; padding-top:4px;}
.card-tag{
  font-family:var(--font-mono); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  padding:4px 10px; border-radius:20px;
}
.card-sem{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);}

.skeleton{
  aspect-ratio:16/13; border-radius:16px; border:1px solid var(--border);
  background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 37%,var(--surface) 63%);
  background-size:400% 100%; animation:shimmer 1.4s ease infinite;
}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}

.empty{
  text-align:center; padding:60px 20px; color:var(--text-faint); font-size:14px;
  border:1px dashed var(--border); border-radius:16px;
}

footer{
  position:relative; z-index:1; text-align:center; padding:30px 20px 40px;
  font-size:12.5px; color:var(--text-faint); font-family:var(--font-mono);
}

@media (max-width:720px){
  .topnav{padding:14px 18px;}
  .searchbox{max-width:none;}
  .brand span.brand-text{display:none;}
  .hero{padding:40px 18px 10px;}
  .filterbar{margin:18px 10px 0; padding:12px 14px;}
  main{padding:26px 18px 80px;}
}
</style>
</head>
<body>

<div class="bg-grid"></div>

<nav class="topnav">
  <div class="brand"><span class="logo">⌨️</span><span class="brand-text">Ekstra Komputer</span></div>
  <div class="searchbox">
    <span class="ic">🔍</span>
    <input id="cari" type="text" placeholder="Cari materi...">
  </div>
</nav>

<header class="hero">
  <span class="eyebrow">💻 Portal Belajar</span>
  <h1>Materi <span class="grad">Ekstrakurikuler Komputer</span></h1>
  <p class="lede">Kumpulan materi, latihan, dan kuis interaktif untuk anggota ekstrakurikuler komputer. Pilih materi di bawah untuk mulai belajar.</p>
  <div class="stats-row" id="stats-row"></div>
</header>

<div class="filterbar">
  <div class="sem-toggle" id="semToggle">
    <button class="sem-btn active" data-sem="semua">Semua</button>
    <button class="sem-btn" data-sem="1">Semester 1</button>
    <button class="sem-btn" data-sem="2">Semester 2</button>
  </div>
  <div class="chip-scroll" id="chipScroll"></div>
</div>

<main>
  <div id="konten">
    <div class="grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>
</main>

<footer>Portal belajar Ekstrakurikuler Komputer · Materi diperbarui berkala oleh pembina.</footer>

<script>
let semuaModul = [];
let semAktif = 'semua';
let kategoriAktif = null;

const GRADIENTS = [
  'linear-gradient(135deg,#2E2B5C,#3E3A8C)',
  'linear-gradient(135deg,#123A4A,#0E5C6B)',
  'linear-gradient(135deg,#4A1F4E,#7A2E6E)',
  'linear-gradient(135deg,#1F3A2E,#256B4A)',
  'linear-gradient(135deg,#4A2A1A,#8A4A22)',
  'linear-gradient(135deg,#2A1F4A,#5A3A8C)'
];
const PALETTE = [
  {bg:'rgba(139,124,251,.15)', text:'#B4A8FF', dot:'#8B7CFB'},
  {bg:'rgba(34,211,238,.15)', text:'#7FE3F2', dot:'#22D3EE'},
  {bg:'rgba(247,111,176,.15)', text:'#F79FC8', dot:'#F76FB0'},
  {bg:'rgba(94,234,176,.15)', text:'#8FF0C4', dot:'#5EEAB0'},
  {bg:'rgba(245,184,96,.15)', text:'#F6CB92', dot:'#F5B860'}
];
function warnaKategori(kat){
  let hash = 0;
  for(let i=0;i<(kat||'').length;i++) hash = kat.charCodeAt(i) + ((hash<<5)-hash);
  return PALETTE[Math.abs(hash) % PALETTE.length];
}

async function muatData(){
  try{
    const res = await fetch(CONTROL_URL + '?t=' + Date.now());
    const semuaBaris = await res.json();
    semuaModul = semuaBaris.filter(m => m.tampilkan === true);
    buatChips();
    buatStats();
    render();
  }catch(err){
    document.getElementById('konten').innerHTML =
      '<div class="empty">Gagal memuat data dari Google Sheet. Pastikan CONTROL_URL di config.js sudah diisi dan Apps Script sudah di-deploy.</div>';
    console.error(err);
  }
}

function buatStats(){
  const s1 = semuaModul.filter(m=>m.semester==='1').length;
  const s2 = semuaModul.filter(m=>m.semester==='2').length;
  const kategori = new Set(semuaModul.map(m=>m.category)).size;
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-pill">📚 <b>${semuaModul.length}</b>&nbsp;materi</div>
    <div class="stat-pill">🏷️ <b>${kategori}</b>&nbsp;kategori</div>
    <div class="stat-pill">📗 Semester 1: <b>${s1}</b></div>
    <div class="stat-pill">📘 Semester 2: <b>${s2}</b></div>
  `;
}

function buatChips(){
  const kategoriUnik = [...new Set(semuaModul.map(m=>m.category).filter(Boolean))];
  const chipWrap = document.getElementById('chipScroll');
  chipWrap.innerHTML = kategoriUnik.map(k=>{
    const w = warnaKategori(k);
    return `<div class="chip" data-kat="${k}"><span class="dot" style="background:${w.dot}"></span>${k}</div>`;
  }).join('');
  chipWrap.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      const isActive = el.classList.contains('active');
      chipWrap.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      kategoriAktif = isActive ? null : el.dataset.kat;
      if(!isActive) el.classList.add('active');
      render();
    });
  });
}

document.getElementById('semToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('.sem-btn');
  if(!btn) return;
  document.querySelectorAll('.sem-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  semAktif = btn.dataset.sem;
  render();
});

function render(){
  const kataKunci = document.getElementById('cari').value.toLowerCase();
  const cocok = (m) => {
    const cocokSem = semAktif==='semua' || m.semester===semAktif;
    const cocokKat = !kategoriAktif || m.category===kategoriAktif;
    const cocokCari = (m.title||'').toLowerCase().includes(kataKunci) || (m.description||'').toLowerCase().includes(kataKunci);
    return cocokSem && cocokKat && cocokCari;
  };
  const hasil = semuaModul.filter(cocok);

  if(hasil.length===0){
    document.getElementById('konten').innerHTML = '<div class="empty">Tidak ada materi yang cocok.</div>';
    return;
  }

  let html = '';
  if(semAktif==='semua'){
    const g1 = hasil.filter(m=>m.semester==='1');
    const g2 = hasil.filter(m=>m.semester==='2');
    if(g1.length) html += buatBlok('Semester 1', g1);
    if(g2.length) html += buatBlok('Semester 2', g2);
  } else {
    html += `<div class="grid">${hasil.map((m,i)=>buatKartu(m,i)).join('')}</div>`;
  }
  document.getElementById('konten').innerHTML = html;
}

function buatBlok(label, daftar){
  return `
    <div class="sec-label">${label} <span class="sec-count">(${daftar.length})</span></div>
    <div class="grid">${daftar.map((m,i)=>buatKartu(m,i)).join('')}</div>
  `;
}

function buatKartu(m, idx){
  const gradien = GRADIENTS[idx % GRADIENTS.length];
  const gambar = (m.image || '').trim();
  const warna = warnaKategori(m.category);
  const thumbHtml = gambar
    ? `<img src="${gambar}" alt="${m.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;fallback&quot; style=&quot;background:${gradien}&quot;>${m.icon||'📄'}</div>'">`
    : `<div class="fallback" style="background:${gradien}">${m.icon || '📄'}</div>`;

  return `
    <a class="card" href="${m.file}">
      <div class="card-thumb">
        ${thumbHtml}
        <div class="badge-icon">${m.icon || '📄'}</div>
      </div>
      <div class="card-body">
        <div class="card-title">${m.title}</div>
        <div class="card-desc">${m.description || ''}</div>
        <div class="card-foot">
          <span class="card-tag" style="background:${warna.bg};color:${warna.text}">${m.category || ''}</span>
          <span class="card-sem">Sem ${m.semester || '-'}</span>
        </div>
      </div>
    </a>
  `;
}

document.getElementById('cari').addEventListener('input', render);
muatData();
</script>

</body>
</html>
